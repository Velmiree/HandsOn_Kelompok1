openapi: 3.1.0

info:
  title: API Kasir Barokah Mart
  version: 0.5.0
  license:
    name: Internal API
    identifier: LicenseRef-Internal
  summary: REST API Point of Sales untuk aplikasi kasir minimarket Barokah Mart.
  description: |
    Kontrak resmi antara tim back end dan tim aplikasi kasir.

    Konvensi umum:
    - Seluruh nilai uang berupa bilangan bulat rupiah (tanpa desimal).
    - Setiap permintaan wajib membawa header Accept: application/json.
    - Kesalahan domain selalu berbentuk { "kesalahan": "...", "pesan": "..." }
      ditambah konteks sesuai jenis kesalahannya.
    - Kesalahan validasi bentuk masukan memakai format bawaan Laravel
      { "message": "...", "errors": { ... } }.

    Aturan bisnis yang disebut pada deskripsi endpoint (AB-1 s.d. AB-14)
    mengacu pada tabel aturan bisnis di dokumen Hands-On.

    Versi dokumen naik setiap kali kontrak berubah.
    Versi 1.0.0 dirilis bersama tag rilis akhir proyek.

  contact:
    name: Tim Back End Barokah Mart
    email: backend@barokah-mart.test

servers:
  - url: /api
    description: Server Laravel yang sedang melayani dokumen ini

security:
  - KunciApi: []

tags:
  - name: Layanan
    description: Pemeriksaan kesehatan layanan. Tidak memerlukan kunci API.

  - name: Katalog
    description: Katalog produk dan informasi pemasok.

  - name: Transaksi
    description: Penjualan, struk, dan pembatalan struk.

  - name: Laporan
    description: Ringkasan penjualan per tanggal.

paths:

  /ping:
    get:
      tags:
        - Layanan
      operationId: pingApi
      summary: Memeriksa status API
      description: Memeriksa status API tanpa memerlukan kunci API.
      security: []
      responses:
        '200':
          description: API aktif.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  toko:
                    type: string
                    example: Toko POS
                  waktu:
                    type: string
                    format: date-time
                    example: '2026-10-04T10:00:00+07:00'
        '400':
          description: Permintaan tidak valid.

  /v1/pos/produk:
    get:
      tags:
        - Katalog
      operationId: daftarProduk
      summary: Mengambil daftar produk
      description: |
        Mengambil katalog produk dengan filter kategori dan pencarian nama.
        Produk yang telah dihapus secara lunak tidak ditampilkan.

      parameters:
        - name: kategori
          in: query
          required: false
          description: Filter berdasarkan kode kategori.
          schema:
            type: string
          example: minuman

        - name: cari
          in: query
          required: false
          description: Pencarian berdasarkan nama produk.
          schema:
            type: string
          example: kopi

      responses:
        '200':
          description: Daftar produk berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Produk'
                  meta:
                    type: object
                    properties:
                      jumlah:
                        type: integer
                        example: 4
                      kategori:
                        type: string
                        example: semua

        '401':
          $ref: '#/components/responses/TanpaKunci'

  /v1/pos/produk/{sku}:
    get:
      tags:
        - Katalog
      operationId: detailProduk
      summary: Mengambil detail satu produk
      description: Mengambil detail produk berdasarkan SKU.

      parameters:
        - $ref: '#/components/parameters/Sku'

      responses:
        '200':
          description: Detail produk berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Produk'

        '401':
          $ref: '#/components/responses/TanpaKunci'

        '404':
          $ref: '#/components/responses/ProdukTidakDitemukan'

  /v1/pos/produk/{sku}/pemasok:
    get:
      tags:
        - Katalog
      operationId: pemasokProduk
      summary: Pemasok dan margin satu produk
      description: |
        Daftar pemasok sebuah produk beserta harga beli dan margin.
        Pemasok utama selalu berada di urutan pertama.

        AB-13 — harga beli dan margin adalah rahasia dagang: hanya
        peran supervisor yang boleh melihatnya. Peran kasir ditolak 403.

      parameters:
        - $ref: '#/components/parameters/Sku'

      responses:
        '200':
          description: Pemasok produk.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProdukDenganPemasok'
              example:
                data:
                  sku: SKU-004
                  nama: Kopi Bubuk 200 g
                  harga: 24000
                  pemasok:
                    - kode: PMS-02
                      nama: PT Distribusi Minuman Jaya
                      kota: Semarang
                      harga_beli: 20400
                      margin: 3600
                      margin_persen: 15.0
                      utama: true
                    - kode: PMS-01
                      nama: CV Sumber Pangan Solo
                      kota: Surakarta
                      harga_beli: 21100
                      margin: 2900
                      margin_persen: 12.1
                      utama: false

        '401':
          $ref: '#/components/responses/TanpaKunci'

        '403':
          $ref: '#/components/responses/PeranTidakBerwenang'

        '404':
          $ref: '#/components/responses/ProdukTidakDitemukan'

  /v1/pos/transaksi:
    get:
      tags:
        - Transaksi
      operationId: daftarTransaksi
      summary: Mengambil daftar transaksi
      description: Mengambil daftar struk pada satu tanggal.

      parameters:
        - name: tanggal
          in: query
          required: false
          description: |
            Tanggal transaksi. Jika kosong, menggunakan tanggal hari ini.
          schema:
            type: string
            format: date
          example: '2026-10-04'

      responses:
        '200':
          description: Daftar transaksi berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Struk'
                  meta:
                    type: object
                    properties:
                      tanggal:
                        type: string
                        format: date
                        example: '2026-10-04'

        '401':
          $ref: '#/components/responses/TanpaKunci'

    post:
      tags:
        - Transaksi
      operationId: buatTransaksi
      summary: Membuat transaksi
      description: Membuat transaksi penjualan baru.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermintaanTransaksi'

      responses:
        '201':
          description: Transaksi berhasil dibuat.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Struk'

        '401':
          $ref: '#/components/responses/TanpaKunci'

        '404':
          $ref: '#/components/responses/ProdukTidakDitemukan'

        '422':
          $ref: '#/components/responses/ValidasiGagal'

  /v1/pos/transaksi/{nomor}:
    get:
      tags:
        - Transaksi
      operationId: detailTransaksi
      summary: Mengambil detail transaksi
      description: Mengambil satu struk berdasarkan nomor transaksi.

      parameters:
        - $ref: '#/components/parameters/NomorTransaksi'

      responses:
        '200':
          description: Detail transaksi berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Struk'

        '401':
          $ref: '#/components/responses/TanpaKunci'

        '404':
          $ref: '#/components/responses/TransaksiTidakDitemukan'

  /v1/pos/transaksi/{nomor}/batal:
    post:
      tags:
        - Transaksi
      operationId: batalTransaksi
      summary: Membatalkan transaksi
      description: |
        Membatalkan transaksi yang sudah dibuat.
        Hanya dapat dilakukan oleh supervisor.

      parameters:
        - $ref: '#/components/parameters/NomorTransaksi'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - alasan
              properties:
                alasan:
                  type: string
                  minLength: 5
                  example: Transaksi salah

      responses:
        '200':
          description: Transaksi berhasil dibatalkan.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Struk'

        '401':
          $ref: '#/components/responses/TanpaKunci'

        '403':
          $ref: '#/components/responses/PeranTidakBerwenang'

        '404':
          $ref: '#/components/responses/TransaksiTidakDitemukan'

        '422':
          $ref: '#/components/responses/ValidasiGagal'

  /v1/pos/laporan/harian:
    get:
      tags:
        - Laporan
      operationId: laporanHarian
      summary: Mengambil laporan penjualan harian
      description: Mengambil ringkasan omzet berdasarkan tanggal.

      parameters:
        - $ref: '#/components/parameters/Tanggal'

      responses:
        '200':
          description: Laporan harian berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      tanggal:
                        type: string
                        format: date
                      jumlah_transaksi:
                        type: integer
                      subtotal:
                        $ref: '#/components/schemas/Rupiah'
                      total_diskon:
                        $ref: '#/components/schemas/Rupiah'
                      total:
                        $ref: '#/components/schemas/Rupiah'

        '401':
          $ref: '#/components/responses/TanpaKunci'

  /v1/pos/laporan/terlaris:
    get:
      tags:
        - Laporan
      operationId: laporanTerlaris
      summary: Mengambil laporan produk terlaris
      description: Mengambil peringkat produk berdasarkan jumlah terjual.

      parameters:
        - $ref: '#/components/parameters/Tanggal'

        - name: batas
          in: query
          required: false
          description: |
            Jumlah produk yang ditampilkan.
            Nilai akan dibatasi antara 1 dan 20.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5

      responses:
        '200':
          description: Laporan produk terlaris berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        sku:
                          type: string
                        nama:
                          type: string
                        jumlah:
                          type: integer
                        pendapatan:
                          $ref: '#/components/schemas/Rupiah'
                  meta:
                    type: object
                    properties:
                      tanggal:
                        type: string
                        format: date
                      batas:
                        type: integer
                        maximum: 20

        '401':
          $ref: '#/components/responses/TanpaKunci'

  /v1/pos/laporan/kategori:
    get:
      tags:
        - Laporan
      operationId: laporanKategori
      summary: Mengambil laporan penjualan per kategori
      description: |
        Mengambil ringkasan penjualan berdasarkan kategori.
        Produk yang telah dihapus secara lunak tidak memengaruhi
        perhitungan pendapatan kategori.

        AB-14 — laporan kategori menggunakan data transaksi
        yang benar-benar terjual.

      parameters:
        - $ref: '#/components/parameters/Tanggal'

      responses:
        '200':
          description: Laporan per kategori berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - kategori
                        - nama
                        - jumlah
                        - pendapatan
                      properties:
                        kategori:
                          type: string
                          example: minuman
                        nama:
                          type: string
                          example: Minuman
                        jumlah:
                          type: integer
                          example: 4
                        pendapatan:
                          $ref: '#/components/schemas/Rupiah'
                          example: 81000
                  meta:
                    type: object
                    properties:
                      tanggal:
                        type: string
                        format: date

        '401':
          $ref: '#/components/responses/TanpaKunci'


components:

  securitySchemes:
    KunciApi:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:

    Sku:
      name: sku
      in: path
      required: true
      description: Kode unik produk.
      schema:
        type: string
        pattern: '^SKU-[0-9]{3}$'
      example: SKU-004

    NomorTransaksi:
      name: nomor
      in: path
      required: true
      description: Nomor unik transaksi POS.
      schema:
        type: string
        pattern: '^POS-[0-9]{8}-[0-9]{4}$'
      example: POS-20260914-0999

    Tanggal:
      name: tanggal
      in: query
      required: false
      description: Tanggal laporan. Jika kosong, menggunakan tanggal hari ini.
      schema:
        type: string
        format: date
      example: '2026-10-04'

  responses:

    TanpaKunci:
      description: Header X-API-Key tidak ada atau tidak dikenal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Kesalahan'
          examples:
            hilang:
              summary: Header tidak dikirim
              value:
                kesalahan: kunci_api_hilang
                pesan: Header X-API-Key wajib disertakan.

            tidakDikenal:
              summary: Kunci salah
              value:
                kesalahan: kunci_api_tidak_dikenal
                pesan: Kunci API tidak dikenal.

    PeranTidakBerwenang:
      description: Peran pemilik kunci API tidak diizinkan melakukan aksi ini.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Kesalahan'
          example:
            kesalahan: peran_tidak_berwenang
            pesan: 'Aksi ini hanya boleh dilakukan oleh: supervisor.'
            peran_anda: kasir

    ProdukTidakDitemukan:
      description: SKU cocok pola, tetapi tidak ada di katalog.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Kesalahan'
          example:
            kesalahan: produk_tidak_ditemukan
            pesan: Produk dengan SKU SKU-999 tidak ditemukan.
            sku: SKU-999

    TransaksiTidakDitemukan:
      description: Nomor struk cocok pola, tetapi tidak ada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Kesalahan'
          example:
            kesalahan: transaksi_tidak_ditemukan
            pesan: Transaksi POS-20260914-0999 tidak ditemukan.
            nomor: POS-20260914-0999

    ValidasiGagal:
      description: Bentuk masukan tidak sah.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KesalahanValidasi'
          example:
            message: The alasan field must be at least 5 characters.
            errors:
              alasan:
                - The alasan field must be at least 5 characters.

  schemas:

    Rupiah:
      type: integer
      minimum: 0
      description: Nilai uang dalam bilangan bulat rupiah.
      example: 24000

    Kesalahan:
      type: object
      description: |
        Kode kesalahan merupakan bagian kontrak dan dapat digunakan
        oleh klien untuk menentukan percabangan. Pesan dapat berubah.
      required:
        - kesalahan
        - pesan
      properties:
        kesalahan:
          type: string
          example: produk_tidak_ditemukan

        pesan:
          type: string
          example: Produk dengan SKU SKU-999 tidak ditemukan.

        peran_anda:
          type: string
          example: kasir

        sku:
          type: string
          example: SKU-999

        nomor:
          type: string
          example: POS-20260914-0999

    KesalahanValidasi:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: The alasan field must be at least 5 characters.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    Produk:
      type: object
      required:
        - sku
        - nama
        - harga
        - stok
        - tersedia
      properties:
        sku:
          type: string
          pattern: '^SKU-[0-9]{3}$'
          example: SKU-001

        nama:
          type: string
          example: Beras Premium

        kategori:
          type: string
          example: kebutuhan_rumah

        kategori_label:
          type: string
          example: Kebutuhan Rumah Tangga

        harga:
          $ref: '#/components/schemas/Rupiah'

        harga_format:
          type: string
          example: Rp72.000

        stok:
          type: integer
          example: 20

        tersedia:
          type: boolean
          example: true

    ProdukDenganPemasok:
      type: object
      required:
        - sku
        - nama
        - harga
        - pemasok
      properties:
        sku:
          type: string
          pattern: '^SKU-[0-9]{3}$'

        nama:
          type: string

        harga:
          $ref: '#/components/schemas/Rupiah'

        pemasok:
          type: array
          items:
            type: object
            required:
              - kode
              - nama
              - kota
              - harga_beli
              - utama
              - margin
              - margin_persen
            properties:
              kode:
                type: string
                example: PMS-02

              nama:
                type: string
                example: PT Distribusi Minuman Jaya

              kota:
                type: string
                example: Semarang

              harga_beli:
                $ref: '#/components/schemas/Rupiah'

              utama:
                type: boolean
                example: true

              margin:
                type: integer
                example: 3600

              margin_persen:
                type: number
                example: 15.0

    MetodeBayar:
      type: string
      enum:
        - tunai
        - qris
        - debit
        - kredit
      example: tunai

    ItemTransaksi:
      type: object
      required:
        - sku
        - kuantitas
      properties:
        sku:
          type: string
          pattern: '^SKU-[0-9]{3}$'
          example: SKU-001

        kuantitas:
          type: integer
          minimum: 1
          example: 2

    ItemStruk:
      type: object
      required:
        - sku
        - nama
        - kuantitas
        - harga
        - subtotal
      properties:
        sku:
          type: string
          pattern: '^SKU-[0-9]{3}$'

        nama:
          type: string

        kuantitas:
          type: integer
          minimum: 1

        harga:
          $ref: '#/components/schemas/Rupiah'

        subtotal:
          $ref: '#/components/schemas/Rupiah'

    PermintaanTransaksi:
      type: object
      required:
        - item
        - metode_bayar
      properties:
        item:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemTransaksi'

        metode_bayar:
          $ref: '#/components/schemas/MetodeBayar'

        member:
          type: boolean
          example: false

        dibayar:
          type: integer
          minimum: 0
          example: 100000

    Struk:
      type: object
      required:
        - nomor
        - waktu
        - kasir
        - member
        - metode_bayar
        - metode_label
        - status
        - item
        - subtotal
        - diskon_grosir
        - diskon_member
        - total_diskon
        - dpp
        - ppn
        - total
        - pembulatan
        - total_bayar
        - dibayar
        - kembalian
        - alasan_batal
        - dibatalkan_oleh
        - dibatalkan_pada
      properties:
        nomor:
          type: string
          pattern: '^POS-[0-9]{8}-[0-9]{4}$'

        waktu:
          type: string
          format: date-time

        kasir:
          type: string

        member:
          type: boolean

        metode_bayar:
          $ref: '#/components/schemas/MetodeBayar'

        metode_label:
          type: string

        status:
          type: string
          enum:
            - selesai
            - batal

        item:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemStruk'

        subtotal:
          $ref: '#/components/schemas/Rupiah'

        diskon_grosir:
          $ref: '#/components/schemas/Rupiah'

        diskon_member:
          $ref: '#/components/schemas/Rupiah'

        total_diskon:
          $ref: '#/components/schemas/Rupiah'

        dpp:
          $ref: '#/components/schemas/Rupiah'

        ppn:
          $ref: '#/components/schemas/Rupiah'

        total:
          $ref: '#/components/schemas/Rupiah'

        pembulatan:
          $ref: '#/components/schemas/Rupiah'

        total_bayar:
          $ref: '#/components/schemas/Rupiah'

        dibayar:
          $ref: '#/components/schemas/Rupiah'

        kembalian:
          $ref: '#/components/schemas/Rupiah'

        alasan_batal:
          type:
            - string
            - 'null'

        dibatalkan_oleh:
          type:
            - string
            - 'null'

        dibatalkan_pada:
          type:
            - string
            - 'null'
          format: date-time